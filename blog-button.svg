<svg xmlns="http://www.w3.org/2000/svg" width="340" height="60">
  <style>
    .btn-rect {
      transition: fill 0.3s ease;
      fill: #D0B0FF;
    }
    svg:hover .btn-rect {
      fill: #B088FF;
    }
    .btn-text {
      transition: transform 0.3s ease;
      transform-origin: center;
    }
    svg:hover .btn-text {
      transform: scale(1.04);
    }
  </style>
  <rect class="btn-rect" x="0" y="0" width="340" height="60" rx="12" />
  <text class="btn-text" x="170" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">🔮 Step Into My Magic Shop</text>
</svg>
